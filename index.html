<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogFlow AI — Get your week back</title>
    <meta name="description" content="Ten production tools in one workspace: campaigns, publishing, proposals and real estate. Replaces $418/mo of subscriptions and around nine hours a week of manual work." />
    <meta name="theme-color" content="#0a0b0d" />
    <meta property="og:title" content="LogFlow AI — Get your week back" />
    <meta property="og:description" content="Ten production tools in one workspace. The work that eats your evenings takes minutes here." />
    <meta property="og:type" content="website" />
    <!-- Brand image (the "System Active" figure that also stars in the
         landing hero's scroll video) as the social-share preview. Root-
         relative path: this repo has no fixed domain hardcoded anywhere
         else, and every major crawler (Facebook/Slack/Discord/iMessage)
         resolves a relative og:image against the page's own URL correctly. -->
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1376" />
    <meta property="og:image:height" content="768" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.jpg" />
    <!-- Fonts are loaded once via the @import at the top of src/index.css —
         do not add a second <link> here, it would duplicate the request. -->
    <!-- Copper "L" mark on ink, matching the landing page's zone palette. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0b0d'/%3E%3Cpath d='M11 7 v14 h10' stroke='%23c0754a' stroke-width='3.2' stroke-linecap='square' fill='none'/%3E%3Ccircle cx='23.5' cy='9.5' r='2.4' fill='%23dda17a'/%3E%3C/svg%3E" />
  </head>
  <!-- overflow-x uses `clip` rather than `hidden` so it never turns an
       ancestor into a scroll container, which would break `position: sticky`
       on the landing page. -->
  <body style="background-color:#0a0b0d;overflow-x:clip" class="bg-surface-0 text-ink-primary min-h-screen relative antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
